<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJDI 鯨鬱症量表 - Phoning OS</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nj-blue: #B1D8F4;
            --nj-pink: #FFB3C6;
            --window-bg: #EAEAEA;
            --border-dark: #000;
            --border-light: #FFF;
        }

        body {
            /* 復古藍色網格背景 */
            background-color: var(--nj-blue);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 復古視窗主體 */
        .window {
            background: var(--window-bg);
            width: 100%;
            max-width: 650px;
            border: 3px solid var(--border-dark);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* 視窗標題列 */
        .title-bar {
            background: var(--border-dark);
            color: #FFF;
            padding: 8px 12px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-controls span {
            display: inline-block;
            width: 15px;
            height: 15px;
            background: #FFF;
            border: 2px solid #000;
            margin-left: 5px;
            cursor: pointer;
        }

        /* 跑馬燈 */
        .marquee-container {
            background: var(--nj-pink);
            color: #000;
            border-bottom: 3px solid #000;
            font-family: 'DotGothic16', sans-serif;
            font-weight: bold;
            padding: 5px 0;
            letter-spacing: 2px;
        }

        .window-content {
            padding: 25px;
            background: #FFF;
        }

        /* 題目區塊設計 */
        .question-block {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--window-bg);
            border-top: 3px solid var(--border-light);
            border-left: 3px solid var(--border-light);
            border-bottom: 3px solid #999;
            border-right: 3px solid #999;
        }

        .question-text {
            font-weight: 700;
            display: block;
            margin-bottom: 12px;
            color: #222;
        }

        .options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .options label {
            background: #FFF;
            border: 2px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.1s;
        }

        .options label:hover {
            background: var(--nj-pink);
        }

        /* 復古按鈕 */
        button {
            width: 100%;
            background: #C0C0C0;
            color: #000;
            border-top: 3px solid #FFF;
            border-left: 3px solid #FFF;
            border-bottom: 3px solid #000;
            border-right: 3px solid #000;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'DotGothic16', sans-serif;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        button:active {
            border-top: 3px solid #000;
            border-left: 3px solid #000;
            border-bottom: 3px solid #FFF;
            border-right: 3px solid #FFF;
            background: #A0A0A0;
        }

        /* 結果區塊 */
        #result-box {
            display: none;
            text-align: center;
            padding: 20px;
            border: 3px dashed #000;
            background: var(--nj-blue);
            margin-top: 20px;
        }

        #result-title {
            font-family: 'DotGothic16', sans-serif;
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="window">
    <!-- 視窗標題列 -->
    <div class="title-bar">
        <span>🐰 Phoning.exe - NJDI Clinical Test</span>
        <div class="title-controls">
            <span></span>
            <span></span>
            <span style="background: var(--nj-pink);"></span>
        </div>
    </div>
    
    <!-- 復古跑馬燈 -->
    <div class="marquee-container">
        <marquee scrollamount="5">⚠️ 警告：本測驗無法取代專業醫療建議。如果您發現體液變成了藍色，請立即尋求 Bunnies 支援。 ⚠️</marquee>
    </div>

    <div class="window-content">
        <form id="njdi-form">
            <div id="questions-container"></div>
            <button type="submit">開始診斷 [ ENTER ]</button>
        </form>

        <div id="result-box">
            <h2 id="result-title"></h2>
            <p style="font-size: 1.2rem;">診斷分數：<strong id="result-score" style="font-size: 1.5rem;"></strong> / 30</p>
            <p id="result-desc" style="font-weight: bold; margin-top: 15px; line-height: 1.6;"></p>
            <button type="button" onclick="location.reload()">重新執行程式 [ F5 ]</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        "每次看到藍色的東西，大腦會自動聯想到 NewJeans。",
        "當官方超過三天沒更新時，會感到明顯的寂寞與心慌。",
        "看到兔子、貓、或麵包時，會不由自主地聯想到成員。",
        "腦中經常自動播放《Ditto》或《OMG》的旋律，揮之不去。",
        "願意為了購買周邊或訂閱 Phoning 而壓縮生活開支。",
        "社交平台上 80% 以上的推播內容都與她們相關。",
        "日常說話會不自覺帶入成員的語氣（如：Hehe, OMG）。",
        "看到 Y2K 風格的穿搭會產生極強的購買衝動。",
        "對於成員的成長（如 Hyein 變高）感到老母親/老父親般的欣慰。",
        "生活唯一的重心就是等待下一次回歸（Comeback）。"
    ];

    const container = document.getElementById('questions-container');

    questions.forEach((q, index) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.innerHTML = `
            <span class="question-text">Q${index + 1}. ${q}</span>
            <div class="options">
                <label><input type="radio" name="q${index}" value="0" required> 從不</label>
                <label><input type="radio" name="q${index}" value="1"> 偶爾</label>
                <label><input type="radio" name="q${index}" value="2"> 經常</label>
                <label><input type="radio" name="q${index}" value="3"> 總是</label>
            </div>
        `;
        container.appendChild(block);
    });

    document.getElementById('njdi-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let score = 0;
        const formData = new FormData(this);
        for (let value of formData.values()) {
            score += parseInt(value);
        }

        let result = {};
        if (score <= 8) {
            result = { status: "【健康小兔子】", desc: "系統判定：狀態穩定。目前處於理性欣賞階段，請繼續保持。", bg: "#d1fae5" };
        } else if (score <= 18) {
            result = { status: "【輕/中度鯨鬱】", desc: "系統判定：出現依賴症狀。建議每天聽三遍《Attention》並補充兔子維他命來穩定心率。", bg: "#fef3c7" };
        } else {
            result = { status: "【鯨鬱症末期】", desc: "系統崩潰 ⚠️：已無藥可醫。建議直接搬到 ADOR 公司門口實習，你就是第六位成員。", bg: "var(--nj-pink)" };
        }

        this.style.display = 'none';
        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        resultBox.style.backgroundColor = result.bg;
        document.getElementById('result-title').innerText = result.status;
        document.getElementById('result-score').innerText = score;
        document.getElementById('result-desc').innerText = result.desc;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>

</body>
</html>
