<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJDI - Archive 1998</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --vhs-blue: #2c3e50;
            --vhs-gray: #7f8c8d;
            --vhs-red: #c0392b;
            --text-glow: #e0e0e0;
            --window-bg: rgba(20, 20, 20, 0.85);
        }

        body {
            background-color: var(--bg-dark); color: var(--text-glow);
            font-family: 'Noto Sans TC', sans-serif; margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background: radial-gradient(circle, #2b2b2b 0%, #000000 100%);
        }

        /* 📺 掃描線特效 */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 999;
        }

        /* 🌟 開場與過場畫面 */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1.5s ease; cursor: pointer;
        }
        #intro-screen.hidden { opacity: 0; pointer-events: none; }

        .vcr-text { font-family: 'VT323', monospace; color: #FFF; font-size: 2.5rem; letter-spacing: 5px; text-shadow: 2px 2px 4px rgba(255,255,255,0.3); }
        .play-icon { font-size: 3rem; margin-bottom: 20px; animation: flicker 0.5s infinite alternate; }
        .click-hint { font-family: 'VT323', monospace; color: var(--vhs-red); font-size: 1.5rem; margin-top: 40px; animation: blink 1.5s infinite; letter-spacing: 3px;}
        @keyframes flicker { 0% { opacity: 0.8; } 100% { opacity: 0.2; } }

        /* 攝影機 UI 元素 */
        .camcorder-ui { position: fixed; font-family: 'VT323', monospace; color: #FFF; font-size: 1.5rem; z-index: 998; pointer-events: none; text-shadow: 1px 1px 2px #000; }
        .rec { top: 30px; left: 30px; display: flex; align-items: center; gap: 10px; }
        .rec-dot { width: 15px; height: 15px; background-color: var(--vhs-red); border-radius: 50%; animation: blink 1s infinite; box-shadow: 0 0 10px var(--vhs-red); }
        .battery { top: 30px; right: 30px; border: 2px solid #FFF; padding: 2px 8px; }
        .date { bottom: 30px; right: 30px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 白光過場 */
        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #FFF; z-index: 9995; opacity: 0; pointer-events: none;
        }
        .flash-anim { animation: flashWhite 0.6s ease-out forwards; }
        @keyframes flashWhite { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

        /* 📺 極簡故障轉場畫面 (去除了兔子的劇烈震動) */
        #transition-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 9990; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .static-noise-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#noiseFilter); opacity: 0.3; /* 調低雜訊透明度，看起來更舒服 */
            animation: tvStatic 0.2s infinite alternate;
        }
        /* 極輕微的背景抖動 */
        @keyframes tvStatic { 
            0% { transform: scale(1.02) translate(1px, 1px); } 
            100% { transform: scale(1.02) translate(-1px, -1px); } 
        }
        
        .transition-status {
            font-family: 'VT323', monospace; color: #FFF; font-size: 3rem;
            position: relative; z-index: 20; text-align: center;
            animation: text-glitch 0.3s infinite; 
            text-shadow: 2px 0px 0px rgba(255,0,0,0.7), -2px 0px 0px rgba(0,255,255,0.7);
        }
        /* 文字本身的輕微錯位閃爍 */
        @keyframes text-glitch {
            0% { transform: translate(0); opacity: 1; }
            20% { transform: translate(-2px, 1px); opacity: 0.8; }
            40% { transform: translate(2px, -1px); opacity: 1; }
            60% { transform: translate(-1px, -1px); opacity: 0.9; }
            80% { transform: translate(1px, 2px); opacity: 1; }
            100% { transform: translate(0); opacity: 1; }
        }

        /* 視窗主體 */
        .window {
            background: var(--window-bg); width: 100%; max-width: 600px;
            border: 1px solid #333; border-radius: 8px; backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(0,0,0,0.8); position: relative;
            z-index: 10; opacity: 0; transform: translateY(20px); transition: all 1.5s ease;
            min-height: 400px; display: flex; flex-direction: column; justify-content: center;
            margin-bottom: 40px; /* 給手機版底部留一點空間 */
        }
        .window.show { opacity: 1; transform: translateY(0); }
        .window-content { padding: 40px 30px; width: 100%; box-sizing: border-box;}

        h1.title { font-family: 'VT323', monospace; text-align: center; font-size: 3.5rem; margin: 0 0 5px 0; color: #FFF; letter-spacing: 3px; font-weight: normal; }
        .subtitle { text-align: center; color: var(--vhs-gray); font-size: 0.9rem; margin-bottom: 25px; letter-spacing: 2px; font-weight: 300; }
        
        .marquee-container {
            background: rgba(192, 57, 43, 0.15); color: var(--text-glow); border-top: 1px solid var(--vhs-red); border-bottom: 1px solid var(--vhs-red);
            font-family: 'VT323', monospace; padding: 6px 0; letter-spacing: 2px; margin-bottom: 30px; font-size: 1.2rem; text-shadow: 1px 1px 2px #000;
        }

        /* 影片區塊 */
        #video-view { display: none; width: 100%; text-align: center; }
        video { width: 100%; border-radius: 5px; border: 1px solid #444; filter: contrast(1.1) brightness(0.9); }

        /* 單題作答區塊 */
        #quiz-view { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .q-counter { font-family: 'VT323', monospace; font-size: 1.5rem; color: var(--vhs-gray); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .question-text { font-weight: 400; display: block; margin-bottom: 25px; color: #FFF; font-size: 1.2rem; line-height: 1.6; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: transparent; color: var(--vhs-gray); border: 1px solid #444;
            padding: 12px 20px; cursor: pointer; font-size: 1rem; transition: 0.2s; border-radius: 3px;
            text-align: left; font-family: 'Noto Sans TC', sans-serif;
        }
        .option-btn:hover { border-color: #FFF; color: #FFF; padding-left: 25px; background: rgba(255,255,255,0.05); }

        .btn-action {
            width: 100%; background: transparent; color: #FFF; border: 1px solid #FFF;
            padding: 15px; font-size: 1.5rem; font-family: 'VT323', monospace; cursor: pointer;
            letter-spacing: 4px; transition: 0.3s;
        }

        /* 🖱️ 只有具備「滑鼠」的裝置（電腦）才啟用 Hover，避免手機卡住反白 */
        @media (hover: hover) {
            .option-btn:hover { border-color: #FFF; color: #FFF; padding-left: 25px; background: rgba(255,255,255,0.05); }
            .btn-action:hover { background: #FFF; color: #000; }
        }

        /* 📱 針對「手機觸控」：只在手指按下的『瞬間』發光，放開就恢復 */
        .option-btn:active { border-color: #FFF; color: #FFF; padding-left: 25px; background: rgba(255,255,255,0.05); transition: 0s; }
        .btn-action:active { background: #FFF; color: #000; transition: 0s; }

        /* 等待動畫區塊 */
        #wait-view { display: none; text-align: center; }

        /* 結果區塊 */
        #result-view { display: none; text-align: center; }
        #result-box { padding: 30px 20px; border: 1px solid #555; background: rgba(0,0,0,0.5); margin-bottom: 20px; }
        #result-title { font-family: 'VT323', monospace; font-size: 2.2rem; margin-bottom: 10px; font-weight: normal; line-height: 1.2;}

        /* 分享按鈕群組 */
        .share-group { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .btn-share { flex: 1; padding: 10px; font-size: 1.2rem; border: 1px solid var(--vhs-gray); background: transparent; color: #FFF; font-family: 'VT323', 'Noto Sans TC'; cursor: pointer; transition: 0.3s;}
        .btn-share.threads { border-color: #e0a96d; color: #e0a96d; }
        .btn-share:hover { background: rgba(255,255,255,0.1); }

        /* 背景音樂按鈕固定在左下角 */
        #music-control {
            position: fixed; bottom: 30px; left: 30px; background: transparent;
            color: #FFF; border: 1px solid var(--vhs-gray); padding: 5px 10px;
            font-family: 'VT323', monospace; font-size: 1.2rem; cursor: pointer;
            z-index: 1000; transition: 0.3s;
        }
        #music-control:hover { border-color: #FFF; }

/* 📱 針對手機與小螢幕的極致優化 (RWD) */
        @media (max-width: 600px) {
            
            /* 🌟 新增：減輕手機版掃描線的厚重感與暗度 */
            body::after {
                /* 把黑色的透明度從 0.25 降到 0.1，並減弱紅綠藍雜訊 */
                background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
                /* 把線條調細一點 */
                background-size: 100% 3px, 3px 100%; 
            }

            /* 🌟 新增：提亮手機版影片，抵銷 OLED 螢幕的暗沉 */
            video {
                filter: contrast(1.05) brightness(1.1); /* 把亮度從 0.9 拉高到 1.1 */
            }

            /* 🌟 新增：視窗背景稍微調亮一點，減少壓迫感 */
            .window {
                background: rgba(30, 30, 30, 0.85); 
            }

            /* --- 以下保留你原本就有的手機版設定 --- */
            body { padding: 10px; }
            .window-content { padding: 25px 15px; }
            .camcorder-ui { font-size: 1.1rem; }
            .rec { top: 15px; left: 15px; }
            .battery { top: 15px; right: 15px; }
            .date { bottom: 15px; right: 15px; }
            .vcr-text { font-size: 1.8rem; }
            .click-hint { font-size: 1.2rem; margin-top: 20px; }
            h1.title { font-size: 2.2rem; letter-spacing: 2px; }
            .subtitle { font-size: 0.8rem; margin-bottom: 15px; }
            .marquee-container { font-size: 1rem; }
            .question-text { font-size: 1.1rem; margin-bottom: 20px; }
            .option-btn { font-size: 0.95rem; padding: 10px 15px; }
            .btn-action { font-size: 1.2rem; padding: 12px; letter-spacing: 2px; }
            #result-title { font-size: 1.8rem; }
            #result-desc { font-size: 1rem; }
            .btn-share { font-size: 1rem; padding: 8px; }
            .transition-status { font-size: 2rem; }
            #music-control { bottom: 15px; left: 15px; font-size: 1rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>

<svg style="display:none;">
    <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter>
</svg>

<div id="intro-screen">
    <div class="vcr-text play-icon">PLAY ▶</div>
    <div class="vcr-text">TAPE 01: NJDI_ARCHIVE</div>
    <div class="click-hint">[ CLICK ANYWHERE TO START ]</div>
</div>

<div id="flash-overlay"></div>

<!-- 極簡版故障畫面 -->
<div id="transition-screen">
    <div class="static-noise-bg"></div>
    <div class="transition-status" id="vcr-status">ANALYZING_MIND...</div>
</div>

<div class="camcorder-ui rec"><div class="rec-dot"></div> REC</div>
<div class="camcorder-ui battery">■■■□</div>
<div class="camcorder-ui date" id="vcr-date"></div>

<!-- 音軌資料庫 -->
<audio id="bgm-start" loop><source src="start-bgm.mp3" type="audio/mpeg"></audio> 
<audio id="bgm-quiz" loop><source src="ditto-bgm.mp3" type="audio/mpeg"></audio> 
<audio id="bgm-res-stable" loop><source src="result-stable.mp3" type="audio/mpeg"></audio> 
<audio id="bgm-res-nostalgic" loop><source src="result-nostalgic.mp3" type="audio/mpeg"></audio> 
<audio id="bgm-res-lost" loop><source src="result-lost.mp3" type="audio/mpeg"></audio> 

<audio id="static-sound"><source src="tv-static.mp3" type="audio/mpeg"></audio>
<audio id="click-sound"><source src="click.mp3" type="audio/mpeg"></audio>

<button id="music-control" onclick="toggleMusic()">[ 🎵 BGM: ON ]</button>
    
<div class="window" id="main-content">
    <div class="window-content">
        
        <div id="start-view">
            <h1 class="title">NJDI_ARCHIVE</h1>
            <div class="subtitle">鯨鬱症自我檢測 / VCR.1</div>
            <div class="marquee-container">
                <marquee scrollamount="5">⚠️ 請確認周圍環境安全，戴上耳機以獲得最佳體驗。 ⚠️</marquee>
            </div>
            <button id="btn-start" class="btn-action">▶ INSERT TAPE (開始測驗)</button>
        </div>

        <div id="video-view">
            <video id="intro-video" src="open.mp4" playsinline></video>
            <div style="font-family: 'VT323'; color: #666; margin-top:10px; letter-spacing: 2px;">PLAYING...</div>
            <button id="btn-skip-video" class="btn-action" style="margin-top: 20px; font-size: 1.2rem; padding: 10px;">▶▶ FAST FORWARD (跳過影片)</button>
        </div>

        <div id="quiz-view">
            <div class="q-counter" id="q-counter">Q_01 / 10</div>
            <div class="question-text" id="question-text">題目文字</div>
            <div class="options" id="options-container"></div>
        </div>

        <div id="wait-view">
            <video id="wait-video" src="waiting.mp4" playsinline preload="auto" style="width: 100%; border: 1px solid #444; border-radius: 5px;"></video>
            <div style="font-family: 'VT323'; color: #aaa; margin-top:15px; letter-spacing: 4px; animation: blink 1s infinite;">PROCESSING_DATA...</div>
            <button id="btn-skip-wait" class="btn-action" style="margin-top: 20px; font-size: 1.2rem; padding: 10px;">▶▶ FAST FORWARD (跳過分析)</button>
        </div>

        <div id="result-view">
            <div id="result-box" style="background-color: #121212;">
                <h2 id="result-title"></h2>
                <p style="font-size: 1.2rem; font-family: 'VT323', monospace; color: #aaa;">SCORE: <strong id="result-score" style="font-size: 1.8rem; color: #FFF;"></strong></p>
                
                <!-- 📸 新增：隨機小卡照片區塊 (加上了一點復古濾鏡) -->
                <img id="result-photo" src="" alt="ARCHIVE_PHOTO" style="width: 100%; max-width: 250px; border-radius: 4px; margin: 15px 0; border: 1px solid #444; filter: contrast(1.1) sepia(0.2) brightness(0.9); display: none;">

                <p id="result-desc" style="font-weight: 300; margin-top: 20px; line-height: 1.8; color: #ddd; text-align: left;"></p>
                
                <!-- 圖片浮水印 -->
                <div style="font-family: 'VT323', monospace; color: #555; margin-top: 30px; font-size: 1rem; border-top: 1px dashed #444; padding-top: 10px; text-align: center;">
                    TAPE_01: NJDI_ARCHIVE<br>
                    https://njditest.vercel.app/
                </div>
            </div>
            
            <div class="share-group">
                <button onclick="shareToThreads()" class="btn-share threads">@ Threads</button>
                <button onclick="shareResult()" class="btn-share">↗ Share IG/Link</button>
            </div>
            <button type="button" class="btn-action" onclick="location.reload()" style="margin-top: 15px;">↺ REWIND TAPE</button>
        </div>

    </div>
</div>

<script>
    const today = new Date();
    document.getElementById('vcr-date').innerText = `1998.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

    const introScreen = document.getElementById('intro-screen');
    const startView = document.getElementById('start-view');
    const videoView = document.getElementById('video-view');
    const quizView = document.getElementById('quiz-view');
    const waitView = document.getElementById('wait-view');
    const resultView = document.getElementById('result-view');
    
    const introVideo = document.getElementById('intro-video');
    const waitVideo = document.getElementById('wait-video');
    const flashOverlay = document.getElementById('flash-overlay');

    let currentQuestionIndex = 0;
    let totalScore = 0;

    let currentBgm = null; 
    let isMusicOn = true;  

    function playClickSound() {
        const clickAudio = document.getElementById('click-sound');
        clickAudio.volume = 1;
        clickAudio.currentTime = 0;
        clickAudio.play().catch(e => {});
    }

    function switchBgm(newBgmElement) {
        if (currentBgm && currentBgm !== newBgmElement) {
            currentBgm.pause();
            currentBgm.currentTime = 0;
        }
        currentBgm = newBgmElement;
        
        if (isMusicOn && currentBgm) {
            currentBgm.volume = 1.0;
            currentBgm.play().catch(e => console.log('BGM Play Blocked'));
        }
    }

    function toggleMusic() {
        playClickSound();
        isMusicOn = !isMusicOn;
        const btn = document.getElementById('music-control');
        
        if (isMusicOn) {
            if (currentBgm) currentBgm.play();
            btn.innerText = "[ 🎵 BGM: ON ]";
            btn.style.color = "#FFF";
        } else {
            if (currentBgm) currentBgm.pause();
            btn.innerText = "[ 🎵 BGM: OFF ]";
            btn.style.color = "var(--vhs-gray)";
        }
    }

    const questions = [
        "當周圍安靜下來時，腦海裡總會迴盪著《Ditto》的哼唱聲。",
        "看到舊式的錄影帶或制服，會不自覺陷入對她們的思念。",
        "冬天起霧的窗戶或灰濛濛的操場，總會讓你想起一段其實根本不存在的校園記憶。",
        "有時候會幻想自己正拿著一台老式 V8 攝影機，默默地在角落記錄著她們的笑聲。",
        "堅信那個拿著攝影機的女孩『Ban Heesoo』不是虛構的角色，她就是我們每個人青春的縮影。",
        "看到兔子形狀的物品或塗鴉，會下意識覺得那是只屬於我們之間的專屬暗號。",
        "為了收藏與她們有關的物品，願意犧牲掉其他的日常開銷。",
        "日常生活中，會默默模仿她們的穿搭風格（如復古寬褲、耳機）。",
        "會把她們的實體專輯或周邊當作某種時空膠囊般小心翼翼地擺放，甚至捨不得拆開。",
        "現實世界的事物已經被重新定義：小麵包等於 Hanni、貓咪等於 Haerin，總覺得生活中到處都有她們的影子。",
        "聽到日常對話中出現某些普通單字（例如 Super、Hype、OMG），大腦會不受控制地自動在心裡接上旋律。",
        "日常說話會不自覺帶入成員的梗（如：Ohh yummy yummy）。",
        "當別人問你『你在聽什麼？時，腦袋會下意識彈出那句名言：『NewJeans』 的 Hype Boy』。",
        "在夜深人靜或是感到孤獨時，只要看著她們五個人圍在一起大笑的影片，就能感覺到被短暫地拯救。",
        "社群媒體上的時間線，已經完全被與她們相關的碎片佔據。",
        "常常在半夜無意識地狂刷Reels / Shorts / threads，看著她們互相打鬧，一回神居然已經過了好幾個小時。",
        "只要在社群上滑到NewJeans的貼文，大腦甚至還沒思考，大拇指就已經自動完成了「按讚、收藏、轉發」的肌肉記憶。",
        "每天會不自覺地瘋狂重整社群媒體，深怕錯過她們的最新消息。",
        "對於錯過的消息、訊息，會產生一種難以言喻的失落感。",
        "手機相簿裡存滿了她們的照片，就像捨不得刪除的舊回憶。",
        "看著她們的影片時，會有一種既溫暖又莫名想哭的衝動。",
        "對於成員的成長與改變，內心充滿了老朋友般的欣慰與感傷。",
        "感覺生活的某一部分，已經永遠停留在等待她們出現的那個冬天。",
        "感覺時間好像被迫按下了暫停鍵，自己只能停留在原地，焦慮又安靜地等待著她們再次笑著回來的那一天。",
        "每當看到關於她們的爭議或是充滿不確定性的未來時，內心會湧起強烈的心痛，恨不得自己能化作盾牌把五個人保護起來。",
        "即使不知道明天會發生什麼事，依然會在夜裡默默祈禱她們能一直在一起，像以前一樣毫無顧忌地大笑、快樂地奔跑。"
    ];

    introScreen.addEventListener('click', () => {
        introScreen.classList.add('hidden');
        switchBgm(document.getElementById('bgm-start')); 
        
        setTimeout(() => { 
            introScreen.style.display = 'none'; 
            document.getElementById('main-content').classList.add('show');
        }, 1000); 
    });

    document.getElementById('btn-start').addEventListener('click', () => {
        playClickSound();
        startView.style.display = 'none';
        videoView.style.display = 'block';
        
        if (currentBgm) currentBgm.pause(); 
        introVideo.play().catch(e => console.log("Video Error:", e));
    });

    function enterQuiz() {
        flashOverlay.classList.add('flash-anim'); 
        switchBgm(document.getElementById('bgm-quiz')); 
        
        setTimeout(() => {
            videoView.style.display = 'none';
            quizView.style.display = 'block';
            renderQuestion(); 
        }, 200); 
        
        setTimeout(() => flashOverlay.classList.remove('flash-anim'), 600);
    }

    introVideo.addEventListener('ended', enterQuiz);
    document.getElementById('btn-skip-video').addEventListener('click', () => {
        playClickSound();
        introVideo.pause(); 
        enterQuiz(); 
    });

    function renderQuestion() {
        quizView.style.animation = 'none';
        quizView.offsetHeight; 
        quizView.style.animation = null;

        // 自動讀取題庫數量，不用再寫死 10 題
        document.getElementById('q-counter').innerText = `Q_${String(currentQuestionIndex + 1).padStart(2, '0')} / ${questions.length}`;
        document.getElementById('question-text').innerText = questions[currentQuestionIndex];
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 

        const optionLabels = ["從不", "偶爾", "經常", "總是"];
        optionLabels.forEach((label, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `[ ${index} ] ${label}`;
            btn.onclick = () => handleAnswer(index);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(score) {
        playClickSound(); 
        totalScore += score;
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            renderQuestion(); 
        } else {
            showWaitAnimation(); 
        }
    }

    function showWaitAnimation() {
        quizView.style.display = 'none';
        waitView.style.display = 'block';
        if (currentBgm) currentBgm.pause(); 
        
        waitVideo.currentTime = 0; 
        waitVideo.play().catch(e => {
            setTimeout(showFinalGlitch, 3000); 
        });

        waitVideo.onended = () => {
            waitView.style.display = 'none';
            showFinalGlitch();
        };
    }

    document.getElementById('btn-skip-wait').addEventListener('click', () => {
        playClickSound(); 
        waitVideo.pause(); 
        waitView.style.display = 'none';
        showFinalGlitch(); 
    });

    // 移除兔子，留下純粹且極簡的文字故障效果
    function showFinalGlitch() {
        const transitionScreen = document.getElementById('transition-screen');
        const staticAudio = document.getElementById('static-sound');
        const vcrStatus = document.getElementById('vcr-status');
        
        transitionScreen.style.display = 'flex';
        staticAudio.play().catch(e => console.log('Audio blocked'));

        setTimeout(() => {
            vcrStatus.innerText = "ERROR: SYSTEM_OVERLOAD";
            vcrStatus.style.color = "red";
        }, 1000);

        setTimeout(() => {
            flashOverlay.classList.add('flash-anim');
            
            setTimeout(() => {
                transitionScreen.style.display = 'none';
                staticAudio.pause(); staticAudio.currentTime = 0;
                resultView.style.display = 'block'; 
                
                // 1️⃣ 計算分數比例
                const maxScore = questions.length * 3; 
                const scoreRatio = totalScore / maxScore; 

                // 2️⃣ 宣告 result (就是這裡之前不小心不見了！)
                let result = {};
                
                if (scoreRatio <= 0.3) {
                    result = { status: "STATUS: STABLE", desc: "你的思緒依然清晰。這是一份健康且理性的欣賞，請將這份美好妥善收藏。", color: "#a8d8ea", bgmId: "bgm-res-stable", bgmVolume: 1.0 };
                } else if (scoreRatio <= 0.6) {
                    result = { status: "STATUS: NOSTALGIC", desc: "你已經染上了淡淡的鯨鬱症。建議在冬日的午後，戴上耳機播放《Ditto》，讓這份思念安靜地釋放。", color: "#f3e1a9", bgmId: "bgm-res-nostalgic", bgmVolume: 0.5 };
                } else {
                    result = { status: "STATUS: LOST_IN_WINTER", desc: "重度鯨鬱症。你的靈魂似乎已經迷失在有她們的那個時空。既然回不去了，就繼續作為第六人，永遠守護這段記憶吧。", color: "#e0a96d", bgmId: "bgm-res-lost", bgmVolume: 0.3 };
                }

                // 3️⃣ 顯示文字與分數
                const title = document.getElementById('result-title');
                title.innerText = result.status;
                title.style.color = result.color;
                
                document.getElementById('result-score').innerHTML = `${totalScore} <span style="font-size: 1.2rem; color: #aaa;">/ ${maxScore}</span>`;
                document.getElementById('result-desc').innerText = result.desc;

                // 4️⃣ 🐰 旗艦抽卡系統：多張 SSR ＋ 階級限定機率
                let finalPhotoSrc = "";
                const gachaRoll = Math.random() * 100; // 系統骰出 0 ~ 100 的隨機數字

                // 🌟 判斷條件：必須是中度以上 (scoreRatio > 0.3) 且 骰中 5% 機率
                if (scoreRatio > 0.3 && gachaRoll <= 5) {
                    
                    // ✨ 歐洲人專屬：進入 SSR 資料夾隨機抽一張
                    const totalSsrPhotos = 3; // 👈 ⚠️ 你的 ssr 資料夾裡有幾張隱藏版，這裡就填多少！
                    const randomNum = Math.floor(Math.random() * totalSsrPhotos) + 1; 
                    finalPhotoSrc = `photos/ssr/${randomNum}.jpg`; 
                    
                } else {
                    
                    // 📦 普通版：根據症狀等級，進入不同資料夾抽卡
                    let folderName = "";
                    let photoCount = 0;

                    if (scoreRatio <= 0.3) {
                        // 🟢 輕度 (STABLE) - 狀態穩定 (沒有抽 SSR 的資格)
                        folderName = "stable";
                        photoCount = 10; // 👈 stable 資料夾裡的照片數量
                    } else if (scoreRatio <= 0.6) {
                        // 🟡 中度 (NOSTALGIC) - 淡淡懷舊
                        folderName = "nostalgic";
                        photoCount = 15; // 👈 nostalgic 資料夾裡的照片數量
                    } else {
                        // 🔴 重度 (LOST_IN_WINTER) - 迷失在冬天
                        folderName = "lost";
                        photoCount = 20; // 👈 lost 資料夾裡的照片數量
                    }

                    // 系統根據剛剛決定的資料夾與總數，自動抽一張
                    const randomNum = Math.floor(Math.random() * photoCount) + 1; 
                    finalPhotoSrc = `photos/${folderName}/${randomNum}.jpg`; 
                }

                // 將抽到的照片顯示在畫面上
                const photoEl = document.getElementById('result-photo');
                photoEl.src = finalPhotoSrc;
                photoEl.style.display = 'inline-block';
                
                // 5️⃣ 播放對應的結果音樂
                switchBgm(document.getElementById(result.bgmId), result.bgmVolume);

            }, 100); 

            setTimeout(() => {
                flashOverlay.classList.remove('flash-anim');
                vcrStatus.innerText = "ANALYZING_MIND...";
                vcrStatus.style.color = "white";
            }, 800);

        }, 2500);
    }

    // 📸 產生圖片並分享的核心功能
    async function shareAsImage() {
        playClickSound();
        const resultBox = document.getElementById('result-box');
        const btn = document.getElementById('btn-share-img');
        const originalText = btn.innerText;
        
        // 顯示載入中動畫，讓玩家知道正在算圖
        btn.innerText = "[ 處理影像中... PROCESSING ]";
        btn.style.pointerEvents = "none";

        try {
            // 使用 html2canvas 將 #result-box 轉成圖片 (scale: 2 讓圖片變高畫質)
            const canvas = await html2canvas(resultBox, {
                backgroundColor: '#121212',
                scale: 2,
                useCORS: true
            });
            
            // 將畫布轉為圖片檔案 (Blob)
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "NJDI_Result.png", { type: "image/png" });
                const shareText = `我在「NJDI 鯨鬱症自我檢測」獲得了 ${document.getElementById('result-title').innerText}！\n\n📼 立即測驗：https://njditest.vercel.app/`;

                // 判斷手機是否支援原生的「圖片分享功能」
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'NJDI 鯨鬱症測驗',
                            text: shareText,
                            files: [file]
                        });
                    } catch (error) {
                        console.log('玩家取消了分享', error);
                    }
                } else {
                    // 電腦版或不支援的手機：自動下載圖片並複製文字
                    const link = document.createElement('a');
                    link.download = 'NJDI_Result.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    navigator.clipboard.writeText(shareText).then(() => {
                        alert("✨ 結果圖已下載！並且文案已複製到剪貼簿，可以直接去發 IG 或 Threads 囉！");
                    });
                }
                
                // 恢復按鈕原本的樣子
                btn.innerText = originalText;
                btn.style.pointerEvents = "auto";
            }, 'image/png');

        } catch (err) {
            console.error(err);
            alert("⚠️ 影像處理失敗，請重試！");
            btn.innerText = originalText;
            btn.style.pointerEvents = "auto";
        }
    }
</script>
