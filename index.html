<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJDI 鯨鬱症量表 - Attention!</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Pacifico&family=Press+Start+2P&family=VT323&family=Noto+Sans+TC:wght@400;700&family=Helvetica&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blue: #3CB4F6;
            --nj-lime: #A3FF22;
            --nj-white: #FFFFFF;
            --box-border: 4px solid #000;
        }

        body {
            background-color: var(--bg-blue);
            font-family: 'Noto Sans TC', 'Helvetica', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌟 進場動畫讀取畫面 🌟 */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-blue);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #intro-screen.hidden {
            transform: translateY(-100vh); /* 向上滑出螢幕 */
            pointer-events: none;
        }

        .loading-text {
            font-family: 'Press Start 2P', cursive;
            color: var(--nj-lime);
            text-shadow: 3px 3px 0px #000;
            font-size: 2rem;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        .progress-box {
            width: 300px;
            height: 30px;
            border: 4px solid #000;
            background: #FFF;
            padding: 4px;
            box-shadow: 5px 5px 0px #000;
        }

        .progress-bar {
            height: 100%;
            background: var(--nj-lime);
            width: 0%;
            animation: fillBar 2s steps(10) forwards;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* 音樂控制按鈕 */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--nj-white);
            border: var(--box-border);
            padding: 10px 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 100;
            border-radius: 50px;
            box-shadow: 4px 4px 0px #000;
            transition: 0.2s;
            opacity: 0; /* 初始隱藏，等動畫播完再出現 */
            transform: translateY(-20px);
        }

        #music-control.show {
            opacity: 1;
            transform: translateY(0);
        }

        #music-control:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        /* 飛天小女警動畫區塊 */
        .flyer-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0; /* 初始隱藏 */
            transition: opacity 1s ease-in-out;
        }

        .flyer-container.show {
            opacity: 1;
        }

        .flyer {
            position: absolute;
            width: 80px;
            opacity: 0.8;
            animation: floatAround linear infinite;
        }

        .flyer:nth-child(1) { top: 10%; left: -10%; animation-duration: 25s; animation-name: flyRight; }
        .flyer:nth-child(2) { top: 60%; right: -10%; animation-duration: 30s; animation-name: flyLeft; }
        .flyer:nth-child(3) { bottom: 10%; left: -10%; animation-duration: 22s; animation-name: flyRightWave; }
        .flyer:nth-child(4) { top: 30%; right: -10%; animation-duration: 28s; animation-name: flyLeftWave; }
        .flyer:nth-child(5) { top: 80%; left: 20%; animation-duration: 35s; animation-name: floatUp; }

        @keyframes flyRight { 0% { transform: translate(0vw, 0) rotate(0deg); } 100% { transform: translate(120vw, 100px) rotate(15deg); } }
        @keyframes flyLeft { 0% { transform: translate(0vw, 0) rotate(0deg); } 100% { transform: translate(-120vw, -50px) rotate(-15deg); } }
        @keyframes flyRightWave { 0% { transform: translate(0vw, 0) rotate(-10deg); } 50% { transform: translate(50vw, -100px) rotate(10deg); } 100% { transform: translate(120vw, 0) rotate(-10deg); } }
        @keyframes flyLeftWave { 0% { transform: translate(0vw, 0) rotate(10deg); } 50% { transform: translate(-50vw, 150px) rotate(-10deg); } 100% { transform: translate(-120vw, 0) rotate(10deg); } }
        @keyframes floatUp { 0% { transform: translate(0, 120vh) rotate(0deg); } 100% { transform: translate(50px, -120vh) rotate(20deg); } }

        /* 測驗主體區塊 */
        .main-container {
            background: var(--nj-white);
            border: var(--box-border);
            box-shadow: 12px 12px 0px #000;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            padding: 30px;
            position: relative;
            z-index: 10;
            opacity: 0; /* 初始隱藏，等進場動畫結束才出現 */
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .main-container.show {
            opacity: 1;
            transform: scale(1);
        }

        h1.mixed-title {
            text-align: center;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            color: var(--nj-lime);
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
        }

        h1.mixed-title span:nth-child(1) { font-family: 'Chewy', cursive; }
        h1.mixed-title span:nth-child(2) { font-family: 'Press Start 2P', cursive; font-size: 2.2rem; }
        h1.mixed-title span:nth-child(3) { font-family: 'Pacifico', cursive; }
        h1.mixed-title span:nth-child(4) { font-family: 'VT323', monospace; font-size: 3.8rem;}
        h1.mixed-title span:nth-child(5) { font-family: 'Helvetica', sans-serif; font-weight: bold; font-style: italic;}
        
        .subtitle {
            text-align: center;
            background: var(--nj-lime);
            border: 3px solid #000;
            border-radius: 50px;
            padding: 5px 15px;
            font-weight: bold;
            display: inline-block;
            margin: 0 auto 30px auto;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            background: #F8F8F8;
            border: 3px solid #000;
            border-radius: 15px;
            transition: 0.3s;
        }

        .question-block:hover {
            background: #E8F6FF;
            transform: translateX(5px);
        }

        .question-text {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: block;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .options label {
            background: #FFF;
            border: 2px solid #000;
            border-radius: 30px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .options input[type="radio"] { display: none; }
        .options input[type="radio"]:checked + span { background: var(--nj-lime); color: #000; }
        .options span { display: inline-block; width: 100%; height: 100%; }

        button[type="submit"], .btn-action {
            width: 100%;
            background: var(--nj-lime);
            color: #000;
            border: 4px solid #000;
            border-radius: 50px;
            padding: 15px;
            font-size: 1.5rem;
            font-family: 'Chewy', cursive;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            text-shadow: 1px 1px 0px #FFF;
        }

        button[type="submit"]:hover, .btn-action:hover {
            background: #FFF;
            transform: translateY(-3px);
            box-shadow: 0px 5px 0px #000;
        }

        #result-box {
            display: none;
            text-align: center;
            padding: 30px;
            border: 4px solid #000;
            border-radius: 20px;
            background: var(--nj-white);
            margin-top: 20px;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        #result-title {
            font-family: 'Chewy', cursive;
            font-size: 2.5rem;
            margin: 10px 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- 🌟 進場動畫覆蓋層 🌟 -->
<div id="intro-screen">
    <div class="loading-text">ATTENTION!</div>
    <div class="progress-box">
        <div class="progress-bar"></div>
    </div>
</div>

<audio id="bgm" loop>
    <source src="your-music-file.mp3" type="audio/mpeg">
</audio>

<button id="music-control" onclick="toggleMusic()">🎵 Play BGM</button>

<div class="flyer-container" id="flyer-bg">
    <img class="flyer" src="https://via.placeholder.com/80/FFB3C6/000000?text=Minji" alt="Minji">
    <img class="flyer" src="https://via.placeholder.com/80/B1D8F4/000000?text=Hanni" alt="Hanni">
    <img class="flyer" src="https://via.placeholder.com/80/FFFFA6/000000?text=Dani" alt="Danielle">
    <img class="flyer" src="https://via.placeholder.com/80/B4F8C8/000000?text=Haerin" alt="Haerin">
    <img class="flyer" src="https://via.placeholder.com/80/E5B3FE/000000?text=Hyein" alt="Hyein">
</div>

<div class="main-container" id="main-content">
    <h1 class="mixed-title">
        <span>N</span><span>J</span><span>D</span><span>I</span> <span>Test</span>
    </h1>
    <div class="subtitle">鯨鬱症自我檢測量表</div>

    <form id="njdi-form">
        <div id="questions-container"></div>
        <button type="submit">確認診斷結果！</button>
    </form>

    <div id="result-box">
        <h2 id="result-title"></h2>
        <p style="font-size: 1.2rem;">診斷分數：<strong id="result-score" style="font-size: 1.8rem; color: var(--bg-blue);"></strong> / 30</p>
        <p id="result-desc" style="font-weight: bold; margin-top: 15px; line-height: 1.6;"></p>
        <button type="button" class="btn-action" onclick="location.reload()">再測一次 🐰</button>
    </div>
</div>

<script>
    // 🌟 進場動畫邏輯 🌟
    window.addEventListener('load', () => {
        // 設定 2.2 秒後結束讀取動畫
        setTimeout(() => {
            const introScreen = document.getElementById('intro-screen');
            const mainContent = document.getElementById('main-content');
            const flyerBg = document.getElementById('flyer-bg');
            const musicBtn = document.getElementById('music-control');

            // 1. 讀取畫面往上滑走
            introScreen.classList.add('hidden');
            
            // 2. 主內容彈跳出現
            mainContent.classList.add('show');
            
            // 3. 背景小飛人浮現
            flyerBg.classList.add('show');

            // 4. 音樂按鈕浮現
            musicBtn.classList.add('show');
            
            // 等動畫結束後徹底隱藏讀取層，避免擋住點擊
            setTimeout(() => {
                introScreen.style.display = 'none';
            }, 800);

        }, 2200); 
    });

    // 音樂控制邏輯
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-control');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            bgm.pause();
            musicBtn.innerText = "🎵 Play BGM";
        } else {
            bgm.play();
            musicBtn.innerText = "⏸️ Pause BGM";
        }
        isPlaying = !isPlaying;
    }

    // 題目資料
    const questions = [
        "每次看到藍色的東西，大腦會自動聯想到 NewJeans。",
        "當官方超過三天沒更新時，會感到明顯的寂寞與心慌。",
        "看到兔子、貓、或麵包時，會不由自主地聯想到成員。",
        "腦中經常自動播放《Ditto》或《OMG》的旋律，揮之不去。",
        "願意為了購買周邊或訂閱 Phoning 而壓縮生活開支。",
        "社交平台上 80% 以上的推播內容都與她們相關。",
        "日常說話會不自覺帶入成員的語氣（如：Hehe, OMG）。",
        "看到 Y2K 風格的穿搭會產生極強的購買衝動。",
        "對於成員的成長感到老母親/老父親般的欣慰。",
        "生活唯一的重心就是等待下一次回歸（Comeback）。"
    ];

    const container = document.getElementById('questions-container');

    questions.forEach((q, index) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.innerHTML = `
            <span class="question-text">Q${index + 1}. ${q}</span>
            <div class="options">
                <label><input type="radio" name="q${index}" value="0" required><span>從不</span></label>
                <label><input type="radio" name="q${index}" value="1"><span>偶爾</span></label>
                <label><input type="radio" name="q${index}" value="2"><span>經常</span></label>
                <label><input type="radio" name="q${index}" value="3"><span>總是</span></label>
            </div>
        `;
        container.appendChild(block);
    });

    // 提交邏輯
    document.getElementById('njdi-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let score = 0;
        const formData = new FormData(this);
        for (let value of formData.values()) {
            score += parseInt(value);
        }

        let result = {};
        if (score <= 8) {
            result = { status: "健康小兔子", desc: "狀態穩定！目前處於理性欣賞階段，請繼續保持這份熱愛。", color: "#A3FF22" };
        } else if (score <= 18) {
            result = { status: "輕中度鯨鬱", desc: "出現依賴症狀！建議每天聽三遍《Attention》並補充兔子維他命來穩定心率。", color: "#FFFFA6" };
        } else {
            result = { status: "鯨鬱症末期", desc: "已無藥可醫 ⚠️ 建議直接搬到 ADOR 公司門口實習，你就是第六位成員！", color: "#FFB3C6" };
        }

        this.style.display = 'none';
        const resultBox = document.getElementById('result-box');
        const rTitle = document.getElementById('result-title');
        
        resultBox.style.display = 'block';
        rTitle.innerText = result.status;
        rTitle.style.color = result.color;
        rTitle.style.WebkitTextStroke = "2px black"; 
        
        document.getElementById('result-score').innerText = score;
        document.getElementById('result-desc').innerText = result.desc;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>

</body>
</html>
